; PlatformIO build for the shotStopper sketch on an Arduino Nano ESP32.
;
;   pio run                     build the default env (micra)
;   pio run -t upload           build and flash over USB
;   pio device monitor          serial log (115200)
;   pio run -e micra_wifi -t upload   flash over WiFi (see examples/shotStopper/README.md)
;
; The sketch and this library are built straight from the repo, so edits to
; AcaiaArduinoBLE.cpp/.h are picked up without installing anything.

[platformio]
src_dir = examples/shotStopper
default_envs = micra

[env]
platform = espressif32@6.10.0
board = arduino_nano_esp32
framework = arduino
lib_deps = arduino-libraries/ArduinoBLE@^1.3.7
; Build the library from the repo root alongside the sketch.
build_src_filter = +<*> +<../../AcaiaArduinoBLE.cpp>
build_flags = -I${PROJECT_DIR}
monitor_speed = 115200

; ShotStopper Micra Interlock board (hardware/shotstopper-micra-interlock).
[env:micra]
build_flags = ${env.build_flags}
  -DMOMENTARY=false
  -DPADDLE_INTERLOCK=true
  -DOTA_ENABLED=false

; Same, with WiFi OTA built in. Needs examples/shotStopper/secrets.h.
; Flash it over USB once:   pio run -e micra_ota -t upload
[env:micra_ota]
build_flags = ${env.build_flags}
  -DMOMENTARY=false
  -DPADDLE_INTERLOCK=true
  -DOTA_ENABLED=true

; The same firmware, flashed over WiFi while the board's OTA window is open:
;   export SHOTSTOPPER_OTA_PASSWORD=...
;   pio run -e micra_wifi -t upload
[env:micra_wifi]
extends = env:micra_ota
upload_protocol = espota
upload_port = shotstopper.local
upload_flags = --auth=${sysenv.SHOTSTOPPER_OTA_PASSWORD}

; Original ShotStopper V2.1 board, using the settings at the top of the sketch.
[env:v21]
