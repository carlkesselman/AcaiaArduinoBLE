; PlatformIO build for the shotStopper sketch.
;
;   pio run                     build the default env (micra)
;   pio run -t upload           build and flash over USB
;   pio device monitor          serial log (115200)
;   pio run -e micra_wifi -t upload   flash over WiFi (see examples/shotStopper/README.md)
;
; The sketch and this library are built straight from the repo, so edits to
; AcaiaArduinoBLE.cpp/.h are picked up without installing anything.

[platformio]
src_dir = examples/shotStopper
default_envs = micra

[env]
platform = espressif32@6.10.0
board = arduino_nano_esp32   ; V2.1; the C3 boards override this
framework = arduino
; This repo is itself the AcaiaArduinoBLE library: link it in as one, so each
; environment compiles its own copy (ESP32-C3 and ESP32-S3 objects must not mix).
lib_deps =
  arduino-libraries/ArduinoBLE@1.5.0   ; pinned: the library reaches into ArduinoBLE internals
  AcaiaArduinoBLE=symlink://${PROJECT_DIR}
; The dependency finder does not pass ArduinoBLE's headers on to the symlinked
; library, so add them by hand.
build_flags = -I${PROJECT_LIBDEPS_DIR}/${PIOENV}/ArduinoBLE/src
monitor_speed = 115200

; ShotStopper Micra Interlock board (hardware/shotstopper-micra-interlock): an
; ESP32-C3-WROOM-02 (4 MB) on the board, flashed through its own USB-C port.
[c3]
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv
c3_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:micra]
board = ${c3.board}
board_build.partitions = ${c3.board_build.partitions}
build_flags = ${env.build_flags} ${c3.c3_flags}
  -DMOMENTARY=false
  -DPADDLE_INTERLOCK=true
  -DOTA_ENABLED=false

; Same, with WiFi OTA built in. Needs examples/shotStopper/secrets.h.
; Flash it over USB once:   pio run -e micra_ota -t upload
[env:micra_ota]
board = ${c3.board}
board_build.partitions = ${c3.board_build.partitions}
build_flags = ${env.build_flags} ${c3.c3_flags}
  -DMOMENTARY=false
  -DPADDLE_INTERLOCK=true
  -DOTA_ENABLED=true

; The same firmware, flashed over WiFi while the board's OTA window is open:
;   export SHOTSTOPPER_OTA_PASSWORD=...
;   pio run -e micra_wifi -t upload
[env:micra_wifi]
extends = env:micra_ota
upload_protocol = espota
upload_port = shotstopper.local
upload_flags = --auth=${sysenv.SHOTSTOPPER_OTA_PASSWORD}

; Original ShotStopper V3.1 board (ESP32-C3), using the settings at the top of the sketch.
[env:v31]
board = ${c3.board}
board_build.partitions = ${c3.board_build.partitions}
build_flags = ${env.build_flags} ${c3.c3_flags}

; Original ShotStopper V2.1 board (Arduino Nano ESP32), using the sketch's settings.
[env:v21]
