; Recovery firmware for the ShotStopper Micra Interlock board. It lives in the
; `factory` partition, is flashed once over USB, and is never updated: its only
; jobs are to accept a new main firmware over WiFi and to show the event log.
;
;   pio run -d recovery -t upload      flash over USB (do this before the main firmware)
;
; Needs examples/shotStopper/secrets.h (the same file the main firmware uses).
[platformio]
default_envs = recovery

[env:recovery]
platform = espressif32@6.10.0
framework = arduino
board = esp32-c3-devkitm-1
board_build.partitions = ../partitions_recovery.csv
board_build.app_partition_name = factory
build_flags =
  -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
  -I../examples/shotStopper
monitor_speed = 115200
